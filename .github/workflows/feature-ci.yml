name: Branch CI/CD

# docs/ops/branch.md が許可するブランチプレフィックスと一致させる。
# プレフィックスを追加・変更したら、branch.md の一覧と本トリガーの両方を更新すること。
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**' # 旧称。新規ブランチでは fix/ を使う
      - 'hotfix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-check:
    runs-on: ubuntu-latest

    outputs:
      lint-result: ${{ steps.lint.outcome }}
      format-result: ${{ steps.format.outcome }}
      build-result: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: |
          # `|| true` を外して実ゲート化した。サマリーを書き切ってから
          # 終了コードを引き継ぐため、失敗時も出力が残る。
          set +e
          npm run lint:check > lint-output.txt 2>&1
          rc=$?
          set -e
          {
            echo "### Lint Results"
            if [ -s lint-output.txt ]; then
              echo '```'
              cat lint-output.txt
              echo '```'
            else
              echo "✅ No linting issues found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Run Prettier Check
        id: format
        run: |
          # `|| true` を外して実ゲート化した。サマリーを書き切ってから
          # 終了コードを引き継ぐため、失敗時も出力が残る。
          set +e
          npm run format:check > format-output.txt 2>&1
          rc=$?
          set -e
          {
            echo "### Format Check Results"
            if [ -s format-output.txt ]; then
              echo '```'
              cat format-output.txt
              echo '```'
            else
              echo "✅ Code formatting is correct"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Verify Service Worker tombstone
        id: sw_tombstone
        run: |
          # public/sw.js は ESLint（ignores に public/**）・Prettier（src/** 限定）・
          # vite の publicDir コピーのいずれからも検査されない。Issue #28 以降、
          # このファイルは「旧 Service Worker 登録を解除する唯一の経路」であり、
          # 壊れても症状が出ないまま旧SWが生き延びる。最低限の不変条件をここで守る。
          # 背景と根拠: docs/standards/performance-and-build.md
          rc=0
          fail() { echo "❌ $1"; rc=1; }

          # 構文エラーは install の失敗＝旧SWの生存を意味する。
          if ! node --check public/sw.js; then
            fail "public/sw.js に構文エラーがある（install が失敗し旧SWが生き残る）"
          fi

          # 以降はコメント行を除いた実コードだけを対象にする。さらに空白を全て潰す。
          # Prettier の折り返しで `self.registration` と `.unregister()` が別行になるため、
          # 行単位の grep では正しいコードを誤検出してしまう。
          flat="$(grep -vE '^[[:space:]]*//' public/sw.js | tr -d '[:space:]')"

          if ! printf '%s' "$flat" | grep -q 'self\.registration\.unregister()'; then
            fail "public/sw.js が self.registration.unregister() を呼んでいない（旧登録が解除されない）"
          fi

          # トゥームストーンは通信に介入してはならない。ハンドラが無ければ
          # リクエストはブラウザ既定の経路へ流れる。
          if printf '%s' "$flat" | grep -q "addEventListener('fetch'"; then
            fail "public/sw.js に fetch ハンドラがある（素通しを壊す）"
          fi

          # 中核の不変条件。register() が復活すると、登録を持たないブラウザにも
          # 「起動直後に自分を消すだけのSW」を新規配布してしまう。
          if grep -rnE "serviceWorker\.register" src/ index.html; then
            fail "Service Worker を登録するコードが復活している"
          fi

          {
            echo "### Service Worker Tombstone"
            if [ "$rc" -eq 0 ]; then
              echo "✅ 自己解除スクリプトのまま、登録コードも復活していない"
            else
              echo "❌ 不変条件の違反あり（上のログを参照）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Build project
        id: build
        run: |
          npm run build
          {
            echo "### Build Results"
            echo "✅ Build completed successfully"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          {
            echo "### Build Artifacts"
            echo "📦 Build size:"
            du -sh dist
          } >> "$GITHUB_STEP_SUMMARY"

  # PR の自動作成は feature/ ブランチ専用。他のプレフィックスでは
  # `BRANCH_NAME#feature/` によるプレフィックス除去が効かず、
  # タイトルにブランチ名がそのまま残るため対象外にする。
  create-pull-request:
    needs: quality-check
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/heads/feature/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract_branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          {
            echo "branch_name=$BRANCH_NAME"
            echo "feature_name=${BRANCH_NAME#feature/}"
          } >> "$GITHUB_OUTPUT"

      - name: Get commit messages
        id: commits
        run: |
          COMMITS="$(git log origin/main..HEAD --pretty=format:"- %s" | head -10)"
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if PR exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.extract_branch.outputs.branch_name }}"
          PR_EXISTS="$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' || echo "")"
          if [ -n "$PR_EXISTS" ]; then
            {
              echo "pr_exists=true"
              echo "pr_number=$PR_EXISTS"
            } >> "$GITHUB_OUTPUT"
            echo "✅ PR already exists: #$PR_EXISTS"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "📝 No existing PR found"
          fi

      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_RESULT: ${{ needs.quality-check.outputs.lint-result }}
          FORMAT_RESULT: ${{ needs.quality-check.outputs.format-result }}
          BUILD_RESULT: ${{ needs.quality-check.outputs.build-result }}
        run: |
          BRANCH_NAME="${{ steps.extract_branch.outputs.branch_name }}"
          FEATURE_NAME="${{ steps.extract_branch.outputs.feature_name }}"
          COMMITS="${{ steps.commits.outputs.commits }}"

          if [ "$LINT_RESULT" = "success" ]; then LINT_STATUS="✅ Passed"; else LINT_STATUS="❌ Failed"; fi
          if [ "$FORMAT_RESULT" = "success" ]; then FORMAT_STATUS="✅ Passed"; else FORMAT_STATUS="❌ Failed"; fi
          if [ "$BUILD_RESULT" = "success" ]; then BUILD_STATUS="✅ Passed"; else BUILD_STATUS="❌ Failed"; fi

          gh pr create \
            --title "🚀 [$FEATURE_NAME] Auto-generated PR" \
            --body "$(cat <<EOF
          ## 📋 Summary
          This PR was automatically created from branch \`$BRANCH_NAME\`.

          ## Quality Check Results
          - **Lint**: $LINT_STATUS
          - **Format Check**: $FORMAT_STATUS
          - **Build**: $BUILD_STATUS

          ## 📝 Recent Commits
          $COMMITS

          ## 🤖 CI/CD Information
          - **Workflow**: ${{ github.workflow }}
          - **Run ID**: ${{ github.run_id }}
          - **Triggered by**: ${{ github.actor }}

          ---
          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH_NAME"

      - name: Update existing PR
        if: steps.check_pr.outputs.pr_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.check_pr.outputs.pr_number }}"
          echo "✅ PR #$PR_NUMBER already exists. Skipping creation."
