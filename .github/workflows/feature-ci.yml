name: Branch CI/CD

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-check:
    runs-on: ubuntu-latest

    outputs:
      lint-result: ${{ steps.lint.outcome }}
      format-result: ${{ steps.format.outcome }}
      build-result: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint:check > lint-output.txt 2>&1

      - name: Report ESLint result
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          {
            echo "### Lint Results"
            if [ "$LINT_RESULT" = "success" ]; then
              echo "✅ ESLint passed"
            else
              echo "❌ ESLint failed (existing baseline; not a blocking gate yet)"
            fi
            if [ -s lint-output.txt ]; then
              echo '```'
              cat lint-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Prettier Check
        id: format
        continue-on-error: true
        run: npm run format:check > format-output.txt 2>&1

      - name: Report Prettier result
        if: always()
        env:
          FORMAT_RESULT: ${{ steps.format.outcome }}
        run: |
          {
            echo "### Format Check Results"
            if [ "$FORMAT_RESULT" = "success" ]; then
              echo "✅ Prettier check passed"
            else
              echo "❌ Prettier check failed (existing baseline; not a blocking gate yet)"
            fi
            if [ -s format-output.txt ]; then
              echo '```'
              cat format-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build project
        id: build
        run: |
          npm run build
          {
            echo "### Build Results"
            echo "✅ Build completed successfully"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          {
            echo "### Build Artifacts"
            echo "📦 Build size:"
            du -sh dist
          } >> "$GITHUB_STEP_SUMMARY"

  create-pull-request:
    needs: quality-check
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/heads/feature/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract_branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          {
            echo "branch_name=$BRANCH_NAME"
            echo "feature_name=${BRANCH_NAME#feature/}"
          } >> "$GITHUB_OUTPUT"

      - name: Get commit messages
        id: commits
        run: |
          COMMITS="$(git log origin/main..HEAD --pretty=format:"- %s" | head -10)"
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if PR exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.extract_branch.outputs.branch_name }}"
          PR_EXISTS="$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' || echo "")"
          if [ -n "$PR_EXISTS" ]; then
            {
              echo "pr_exists=true"
              echo "pr_number=$PR_EXISTS"
            } >> "$GITHUB_OUTPUT"
            echo "✅ PR already exists: #$PR_EXISTS"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "📝 No existing PR found"
          fi

      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_RESULT: ${{ needs.quality-check.outputs.lint-result }}
          FORMAT_RESULT: ${{ needs.quality-check.outputs.format-result }}
          BUILD_RESULT: ${{ needs.quality-check.outputs.build-result }}
        run: |
          BRANCH_NAME="${{ steps.extract_branch.outputs.branch_name }}"
          FEATURE_NAME="${{ steps.extract_branch.outputs.feature_name }}"
          COMMITS="${{ steps.commits.outputs.commits }}"

          if [ "$LINT_RESULT" = "success" ]; then LINT_STATUS="✅ Passed"; else LINT_STATUS="❌ Failed"; fi
          if [ "$FORMAT_RESULT" = "success" ]; then FORMAT_STATUS="✅ Passed"; else FORMAT_STATUS="❌ Failed"; fi
          if [ "$BUILD_RESULT" = "success" ]; then BUILD_STATUS="✅ Passed"; else BUILD_STATUS="❌ Failed"; fi

          gh pr create \
            --title "🚀 [$FEATURE_NAME] Auto-generated PR" \
            --body "$(cat <<EOF
          ## 📋 Summary
          This PR was automatically created from branch \`$BRANCH_NAME\`.

          ## Quality Check Results
          - **Lint**: $LINT_STATUS
          - **Format Check**: $FORMAT_STATUS
          - **Build**: $BUILD_STATUS

          ## 📝 Recent Commits
          $COMMITS

          ## 🤖 CI/CD Information
          - **Workflow**: ${{ github.workflow }}
          - **Run ID**: ${{ github.run_id }}
          - **Triggered by**: ${{ github.actor }}

          ---
          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH_NAME"

      - name: Update existing PR
        if: steps.check_pr.outputs.pr_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.check_pr.outputs.pr_number }}"
          echo "✅ PR #$PR_NUMBER already exists. Skipping creation."
